<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="googlebot" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>任务</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="任务">
<meta name="theme-color" content="#2563eb">
<style>
  :root{
    --bg1:#eef5ff; --bg2:#dbe9ff; --ink:#12203a; --muted:#64748b;
    --card:rgba(255,255,255,.82); --line:rgba(18,32,58,.08);
    --accent:#2563eb; --accent2:#1d4ed8;
    --year:#e11d48; --month:#1e3a8a; --week:#eab308; --day:#111827;
    --ok:#059669; --miss:#b45309;
    --r:18px;
  }
  body.baby{
    --bg1:#fbf7ff; --bg2:#e9dbff; --ink:#26183a; --muted:#7c6a95;
    --card:rgba(255,255,255,.84); --line:rgba(38,24,58,.08);
    --accent:#a855f7; --accent2:#9333ea;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2) 60%,#fff);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 28px) env(safe-area-inset-left);
  }
  .wrap{max-width:640px;margin:0 auto;padding:18px 16px 40px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:34px}
  .top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.5px;flex:1}
  .ghost{
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;
  }
  .ghost:active{transform:scale(.97)}
  /* 入口页 */
  .gate{min-height:82vh;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:8px}
  .gate .hi{font-size:15px;color:var(--muted);text-align:center;margin-bottom:-4px}
  .gatebtn{
    border:0;border-radius:26px;padding:34px 20px;font-size:26px;font-weight:800;letter-spacing:2px;
    cursor:pointer;color:#fff;transition:transform .15s ease;box-shadow:0 18px 40px -18px rgba(0,0,0,.55);
  }
  .gatebtn:active{transform:scale(.975)}
  .gatebtn.me{background:linear-gradient(120deg,#000 0%,#1b1b1b 40%,#8a0f18 75%,#ff2d3f 100%)}
  .gatebtn.baby{background:linear-gradient(120deg,#ff9ec7,#ff5fa2 55%,#c86bff)}
  .gate .tip{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7}
  /* 通用卡片 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;backdrop-filter:blur(6px)}
  .card h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600;letter-spacing:.6px}
  /* 四层按钮 */
  .levels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .lv{
    border:0;border-radius:22px;color:#fff;text-align:left;padding:20px 18px;cursor:pointer;
    display:flex;flex-direction:column;gap:6px;box-shadow:0 14px 30px -18px rgba(0,0,0,.65);
    transition:transform .12s ease;
  }
  .lv:active{transform:scale(.97)}
  .lv .t{font-size:21px;font-weight:800;letter-spacing:1px}
  .lv .s{font-size:12.5px;opacity:.85}
  .lv.year{background:linear-gradient(135deg,#f43f5e,#be123c)}
  .lv.month{background:linear-gradient(135deg,#1e40af,#0f2a6b)}
  .lv.week{background:linear-gradient(135deg,#facc15,#d19a00);color:#3a2a00}
  .lv.week .s{opacity:.75}
  .lv.day{background:linear-gradient(135deg,#1f2937,#000)}
  .row2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  /* 任务条目 */
  .item{
    position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);
    background:#fff;margin-bottom:9px;padding:0;user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none;touch-action:pan-y;
  }
  .item .fill{
    position:absolute;inset:0;width:0%;background:linear-gradient(90deg,rgba(37,99,235,.16),rgba(37,99,235,.30));
    pointer-events:none;
  }
  body.baby .item .fill{background:linear-gradient(90deg,rgba(168,85,247,.16),rgba(168,85,247,.32))}
  .item .inner{position:relative;display:flex;align-items:center;gap:10px;padding:13px 12px}
  .item.pressing{animation:shake .28s infinite}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
  .item .txt{flex:1;font-size:15.5px;line-height:1.45;word-break:break-word}
  .item .meta{font-size:11.5px;color:var(--muted);margin-top:3px}
  .item .acts{display:flex;gap:6px;flex-shrink:0}
  .mini{
    border:1px solid var(--line);background:rgba(255,255,255,.9);border-radius:10px;
    font-size:12px;padding:7px 9px;color:var(--ink);cursor:pointer;line-height:1;
  }
  .mini.ok{color:#fff;background:var(--ok);border-color:var(--ok)}
  .mini.miss{color:#fff;background:var(--miss);border-color:var(--miss)}
  .mini.del{color:#94a3b8}
  .item.done .txt{text-decoration:line-through;color:#9aa5b4}
  .item.missed{border-color:rgba(180,83,9,.35);background:#fffdf6}
  .item.out{transition:transform .25s ease,opacity .25s ease;transform:translateX(-40px);opacity:0}
  /* 折叠 */
  details.fold{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:0;margin-bottom:12px;overflow:hidden}
  details.fold>summary{
    list-style:none;cursor:pointer;padding:13px 15px;font-size:14px;font-weight:600;color:var(--ink);
    display:flex;align-items:center;justify-content:space-between;
  }
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold>summary .badge{background:#fff1f2;color:#be123c;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
  details.fold .body{padding:0 12px 12px}
  /* 添加框 */
  .addbox{margin-top:6px}
  .hint{font-size:12.5px;color:var(--muted);line-height:1.65;margin:2px 0 8px}
  .hint b{color:var(--ink);font-weight:600}
  .inputrow{display:flex;gap:8px}
  input[type=text]{
    flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px 12px;font-size:15px;
    background:#fff;color:var(--ink);outline:none;
  }
  input[type=text]:focus{border-color:var(--accent)}
  .primary{
    border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));cursor:pointer;flex-shrink:0;
  }
  .primary:active{transform:scale(.97)}
  .warn{color:#b45309;font-size:12.5px;margin-top:8px;display:none}
  .warn.show{display:block}
  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:16px 8px}
  .divider{height:1px;background:var(--line);margin:14px 0}
  .secline{font-size:12.5px;color:var(--muted);letter-spacing:.8px;margin:16px 0 8px;font-weight:600}
  /* 日历 */
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
  .calhead .m{font-size:16px;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .grid .wd{text-align:center;font-size:11.5px;color:var(--muted);padding:4px 0}
  .cell{
    aspect-ratio:1/1;border-radius:11px;border:1px solid transparent;background:rgba(255,255,255,.6);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:13.5px;cursor:pointer;color:var(--ink);position:relative;
  }
  .cell.blank{background:transparent;cursor:default}
  .cell.today{border-color:var(--accent);font-weight:800}
  .cell.sel{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
  .cell .dots{display:flex;gap:2px;height:5px}
  .cell .dot{width:5px;height:5px;border-radius:50%}
  .dot.y{background:var(--year)} .dot.m{background:var(--month)} .dot.w{background:var(--week)} .dot.d{background:var(--day)}
  .cell.sel .dots{opacity:.9}
  .daytitle{font-size:15px;font-weight:700;margin:14px 0 8px}
  .kicker{font-size:11.5px;letter-spacing:1px;color:var(--muted);margin:14px 0 7px}
  .kicker:first-child{margin-top:2px}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(37,99,247,.10);color:var(--accent);margin-right:6px}
  body.baby .pill{background:rgba(168,85,247,.12)}
  .foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:22px;line-height:1.8}
  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%) translateY(20px);
    background:rgba(17,24,39,.92);color:#fff;font-size:13.5px;padding:10px 16px;border-radius:999px;
    opacity:0;transition:all .22s ease;pointer-events:none;z-index:99;max-width:88%;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="toast" class="toast"></div>
<script>
/* ===== 基础工具 ===== */
const LS_KEY = 'alapati.tasks.v1';
const pad = n => String(n).padStart(2,'0');
const $  = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

const ymd   = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const ymKey = d => d.getFullYear()+'-'+pad(d.getMonth()+1);
const yKey  = d => String(d.getFullYear());

function isoWeekKey(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (t.getUTCDay()+6)%7;         // 周一=0
  t.setUTCDate(t.getUTCDate()-dayNum+3);      // 本周周四
  const firstThu = new Date(Date.UTC(t.getUTCFullYear(),0,4));
  const fDay = (firstThu.getUTCDay()+6)%7;
  firstThu.setUTCDate(firstThu.getUTCDate()-fDay+3);
  const week = 1 + Math.round((t-firstThu)/(7*864e5));
  return t.getUTCFullYear()+'-W'+pad(week);
}
function startOfWeek(d){
  const t = new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const day = (t.getDay()+6)%7;
  t.setDate(t.getDate()-day);
  return t;
}
function addDays(d,n){ const t=new Date(d.getFullYear(),d.getMonth(),d.getDate()); t.setDate(t.getDate()+n); return t; }
function daysBetween(aStr,bStr){ // b - a 天数
  const a = new Date(aStr+'T00:00:00'), b = new Date(bStr+'T00:00:00');
  return Math.round((b-a)/864e5);
}
function cnDate(s){ const [y,m,d]=s.split('-'); return y+'年'+(+m)+'月'+(+d)+'日'; }
const WEEK_CN = ['一','二','三','四','五','六','日'];

/* ===== 存储 ===== */
function blankBook(){ return {items:[]}; }
function loadDB(){
  let db = null;
  try{ db = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); }catch(e){}
  if(!db || typeof db !== 'object') db = {};
  db.version = 1;
  db.last = db.last === 'baby' ? 'baby' : (db.last === 'me' ? 'me' : '');
  db.me   = db.me   && Array.isArray(db.me.items)   ? db.me   : blankBook();
  db.baby = db.baby && Array.isArray(db.baby.items) ? db.baby : blankBook();
  return db;
}
let DB = loadDB();
let CUR = null;            // 'me' | 'baby'，本次会话身份
let VIEW = {name:'gate'};  // 当前视图

function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
  catch(e){ toast('存不下了，先去导出备份'); }
}
function book(){ return CUR ? DB[CUR] : null; }
function items(){ return book() ? book().items : []; }

/* ===== 主题 ===== */
function applyTheme(){
  document.body.classList.toggle('baby', CUR === 'baby');
}

/* ===== 提示 ===== */
let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1900);
}

/* ===== 层级配置（引导文案来自「目标分层.md」） ===== */
const LEVELS = {
  year: {
    key:'year', name:'年度目标', color:'year',
    slots:[
      { slot:'north', label:'北极星', max:1,
        hint:'<b>只放 1 条。</b>写一年后能验收的状态，不写“学好英语”“提升能力”这种形容词。',
        ph:'2027 年 6 月前：408 四门过完一遍 + 绩点回中游 + 实验室有 1 个能说出口的东西' },
      { slot:'bottom', label:'底线', max:3,
        hint:'<b>最多 3 条，掉一条就算警报。</b>要小到每天都做得到。',
        ph:'单词一天不断（哪怕只复习 50 个）' }
    ]
  },
  month: {
    key:'month', name:'月度目标', color:'month',
    slots:[
      { slot:'deliver', label:'本月交付物', max:1,
        hint:'<b>必须是一个名词：</b>一张图、一份报告、一个仓库、一套题。“学习了 X”不算。',
        ph:'PyTorch 手写网络跑通 Indian Pines，出图 + 精度表' }
    ]
  },
  week: {
    key:'week', name:'周目标', color:'week',
    slots:[
      { slot:'main', label:'本周主攻', max:1,
        hint:'<b>只填一件事，通常是实验室或当前最大的卡点。</b>主攻断了要复盘。',
        ph:'手写两层全连接 + CrossEntropyLoss 跑通' },
      { slot:'keep', label:'维持', max:2,
        hint:'<b>最多 2 条，填最小可完成的量。</b>断了不算失败，下周接上。',
        ph:'数学 1 章 / 408 1 章' }
    ]
  },
  day: {
    key:'day', name:'日目标', color:'day',
    slots:[
      { slot:'task', label:'今天的事', max:99,
        hint:'<b>写具体到能验收：</b>“看完并默写了…”，别写“学习”。',
        ph:'看完 nn.Module 那节，手写一个空 class 跑通 forward' }
    ]
  }
};
const SLOT_LABEL = { north:'北极星', bottom:'底线', deliver:'交付物', main:'主攻', keep:'维持', task:'任务' };
const LEVEL_LABEL = { year:'年', month:'月', week:'周', day:'日' };

/* 形容词/空话检测（只提示，不拦） */
const VAGUE = /^(学习|提升|提高|加强|努力|了解|熟悉|掌握|多练|加油|背单词$|好好学)/;
function vagueWarn(title){
  if(VAGUE.test(title.trim())) return '这是一句“要做什么”，不是能验收的东西。改成名词或数字，比如“一张图/一份报告/错 ≤ 4 个”。';
  return '';
}

/* ===== 周期键 ===== */
function periodKey(level, d){
  if(level==='year')  return yKey(d);
  if(level==='month') return ymKey(d);
  if(level==='week')  return isoWeekKey(d);
  return ymd(d);
}
function periodLabel(level, d){
  if(level==='year')  return d.getFullYear()+' 年';
  if(level==='month') return d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月';
  if(level==='week'){
    const s = startOfWeek(d), e = addDays(s,6);
    return '第 '+isoWeekKey(d).split('-W')[1]+' 周 · '+(s.getMonth()+1)+'/'+s.getDate()+' – '+(e.getMonth()+1)+'/'+e.getDate();
  }
  return cnDate(ymd(d))+' 周'+WEEK_CN[(d.getDay()+6)%7];
}

/* ===== 视图：入口 ===== */
function renderGate(){
  VIEW = {name:'gate'};
  applyTheme();
  document.body.classList.remove('baby');
  $('#app').innerHTML = `
    <div class="gate">
      <div class="hi">选一个，数据各存各的</div>
      <button class="gatebtn me" data-go="me">me</button>
      <button class="gatebtn baby" data-go="baby">baby</button>
      <div class="tip">两个入口的数据完全独立，互不影响<br>想换回来点右上角的身份按钮</div>
    </div>`;
  document.querySelectorAll('[data-go]').forEach(b=>{
    b.onclick = ()=>{
      CUR = b.dataset.go; DB.last = CUR; save(); applyTheme(); renderHome();
    };
  });
}

/* ===== 视图：主页 ===== */
function renderHome(){
  if(!CUR){ renderGate(); return; }
  applyTheme();
  VIEW = {name:'home'};
  const today = new Date();
  const tKey = ymd(today);
  const all = items();

  // 今日任务
  const todayItems = all.filter(i=>i.level==='day' && i.key===tKey && i.status!=='done');

  // 逾期
  const overdue = all.filter(i=>i.level==='day' && i.key<tKey && i.status==='pending')
                     .sort((a,b)=> a.key<b.key ? -1 : 1);

  // 提醒卡
  const remind = [];
  if(today.getDay()===0){
    const wk = all.filter(i=>i.level==='week' && i.key===isoWeekKey(today));
    remind.push({label:'今天是周日 · 本周目标', items:wk, go:'week'});
  }
  const lastDay = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
  if(today.getDate()===lastDay){
    const mo = all.filter(i=>i.level==='month' && i.key===ymKey(today));
    remind.push({label:'今天是本月最后一天 · 本月交付物', items:mo, go:'month'});
  }
  if(today.getMonth()===0 && today.getDate()===1){
    const yr = all.filter(i=>i.level==='year' && i.key===yKey(today));
    remind.push({label:'新年第一天 · 年度目标', items:yr, go:'year'});
  }

  $('#app').innerHTML = `
    <div class="top">
      <h1>${CUR==='me'?'me':'baby'}</h1>
      <button class="ghost" id="switch">换身份</button>
    </div>

    <div class="levels">
      <button class="lv year"  data-lv="year"><span class="t">年</span><span class="s">北极星 1 + 底线 3</span></button>
      <button class="lv month" data-lv="month"><span class="t">月</span><span class="s">1 个交付物</span></button>
      <button class="lv week"  data-lv="week"><span class="t">周</span><span class="s">1 主攻 + 2 维持</span></button>
      <button class="lv day"   data-lv="day"><span class="t">日</span><span class="s">今天三件事</span></button>
    </div>

    <div class="row2">
      <button class="ghost" data-lv="cal">日历</button>
      <button class="ghost" data-lv="missed">未完成</button>
      <button class="ghost" data-lv="done">已完成</button>
    </div>

    ${remind.map(r=>`
      ${r.items.length? `<div class="card">
        <h2>${esc(r.label)}</h2>
        ${r.items.map(renderItem).join('')}
      </div>`:''}
    `).join('')}

    <div class="secline">今天 · ${cnDate(tKey)}</div>
    ${todayItems.length ? todayItems.map(renderItem).join('') : `<div class="empty">今天还没事，去「日」里加一条</div>`}

    ${overdue.length ? `
      <details class="fold">
        <summary>逾期 <span class="badge">${overdue.length} 条</span></summary>
        <div class="body">
          ${overdue.map(i=>renderItem(i, true)).join('')}
        </div>
      </details>`:''}

    <div class="card" style="margin-top:16px">
      <h2>数据</h2>
      <div class="row2" style="grid-template-columns:1fr 1fr">
        <button class="ghost" id="exp">导出备份</button>
        <button class="ghost" id="imp">导入备份</button>
      </div>
      <input type="file" id="file" accept=".json,application/json" style="display:none">
      <div class="hint" style="margin:10px 0 0">手机导出的 json 可以直接发到电脑，在电脑上点导入，两边就一样了。</div>
    </div>

    <div class="foot">拖不动就长按任意一条任务 → 圆圈满了算完成<br>不想做就点「没达成」，它会进未完成，之后随时补</div>
  `;

  document.querySelectorAll('[data-lv]').forEach(b=>{
    b.onclick = ()=>{
      const lv = b.dataset.lv;
      if(lv==='cal') return renderCalendar({});
      if(lv==='missed') return renderList('missed');
      if(lv==='done') return renderList('done');
      renderLevel(lv, new Date());
    };
  });
  $('#switch').onclick = ()=>{ CUR=null; renderGate(); };
  bindGestures();

  $('#exp').onclick = ()=>{
    const data = {app:'alapati-tasks', version:1, exportedAt:new Date().toISOString(), data:DB};
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tasks-'+CUR+'-'+ymd(new Date())+'.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
    toast('已导出');
  };
  $('#imp').onclick = ()=> $('#file').click();
  $('#file').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const j = JSON.parse(r.result);
        const d = j && j.data ? j.data : j;
        if(!d || !d.me || !d.baby) throw new Error('格式不对');
        if(!confirm('导入会覆盖当前的 me / baby 数据，确定？')) return;
        DB = {
          version:1,
          last: CUR || d.last || 'me',
          me:   d.me.items   ? d.me   : blankBook(),
          baby: d.baby.items ? d.baby : blankBook()
        };
        save(); renderHome(); toast('导入好了');
      }catch(err){ toast('这个文件读不了'); }
    };
    r.readAsText(f);
  };
}

/* ===== 单条任务 ===== */
function statusMeta(i){
  if(i.status==='done') return {t:'已完成', cls:'done'};
  if(i.status==='missed') return {t:'没达成', cls:'missed'};
  if(i.level==='day'){
    const over = daysBetween(i.key, ymd(new Date()));
    if(over>0) return {t:'逾期 '+over+' 天', cls:''};
  }
  return {t:'', cls:''};
}
function renderItem(i, showPeriod){
  const m = statusMeta(i);
  const period = showPeriod || (i.level!=='day') ? `<div class="meta">${LEVEL_LABEL[i.level]} · ${periodLabel(i.level, fromKey(i.level,i.key))}</div>` : '';
  const acts = [];
  if(i.status==='pending'){
    acts.push(`<button class="mini ok" data-done="${i.id}">✓</button>`);
    acts.push(`<button class="mini miss" data-miss="${i.id}">没达成</button>`);
  }else if(i.status==='missed'){
    acts.push(`<button class="mini ok" data-done="${i.id}">补上</button>`);
  }
  acts.push(`<button class="mini del" data-del="${i.id}">删</button>`);
  return `
  <div class="item ${m.cls}" data-id="${i.id}">
    <div class="fill"></div>
    <div class="inner">
      <div style="flex:1;min-width:0">
        <span class="pill">${SLOT_LABEL[i.slot]||''}</span>
        <span class="txt">${esc(i.title)}</span>
        ${period}
        ${m.t ? `<div class="meta">${m.t}</div>` : ''}
      </div>
      <div class="acts">${acts.join('')}</div>
    </div>
  </div>`;
}
function fromKey(level, key){
  if(level==='day'){ const [y,m,d]=key.split('-').map(Number); return new Date(y,m-1,d); }
  if(level==='month'){ const [y,m]=key.split('-').map(Number); return new Date(y,m-1,1); }
  if(level==='week'){
    const [y,w] = key.split('-W').map(Number);
    const jan4 = new Date(y,0,4);
    const s = startOfWeek(jan4);
    return addDays(s, (w-1)*7);
  }
  return new Date(+key,0,1);
}

/* ===== 层级页 ===== */
function renderLevel(level, date){
  if(!CUR){ renderGate(); return; }
  const cfg = LEVELS[level];
  const key = periodKey(level, date);
  const mine = items().filter(i=>i.level===level && i.key===key);

  let body = '';
  cfg.slots.forEach(s=>{
    const list = mine.filter(i=>i.slot===s.slot);
    body += `
      <div class="card">
        <h2>${esc(s.label)} <span style="float:right;font-weight:400">${list.length}/${s.max===99?'∞':s.max}</span></h2>
        <div class="hint">${s.hint}</div>
        ${list.length ? list.map(renderItem).join('') : `<div class="empty">还空着</div>`}
        ${list.filter(i=>i.status!=='done').length < s.max ? `
          <div class="addbox">
            <div class="inputrow">
              <input type="text" data-inp="${s.slot}" placeholder="${esc(s.ph)}" maxlength="120">
              <button class="primary" data-add="${s.slot}">加</button>
            </div>
            <div class="warn" data-warn="${s.slot}"></div>
          </div>`:''}
      </div>`;
  });

  $('#app').innerHTML = `
    <div class="top">
      <button class="ghost" id="back">返回</button>
      <h1>${cfg.name}</h1>
      <div style="display:flex;gap:6px">
        <button class="ghost" id="prev">‹</button>
        <button class="ghost" id="next">›</button>
      </div>
    </div>
    <div class="secline" style="margin-top:0">${periodLabel(level, date)}</div>
    ${body}
    <div class="foot">长按一条任务 → 圆圈满了就算完成</div>
  `;

  $('#back').onclick = renderHome;
  $('#prev').onclick = ()=> renderLevel(level, shift(level, date, -1));
  $('#next').onclick = ()=> renderLevel(level, shift(level, date,  1));

  document.querySelectorAll('[data-add]').forEach(btn=>{
    btn.onclick = ()=>{
      const slot = btn.dataset.add;
      const inp = document.querySelector(`input[data-inp="${slot}"]`);
      const title = (inp.value||'').trim();
      if(!title){ toast('写点东西'); return; }
      const w = vagueWarn(title);
      if(w && !confirm(w + '\n\n还按现在这样存吗？')) return;
      items().push({
        id: uid(), level, slot, key, title,
        status:'pending', createdAt: new Date().toISOString(), doneAt:null
      });
      save(); renderLevel(level, date);
    };
  });

  bindGestures();
}

function shift(level, date, dir){
  if(level==='year')  return new Date(date.getFullYear()+dir, 0, 1);
  if(level==='month') return new Date(date.getFullYear(), date.getMonth()+dir, 1);
  if(level==='week')  return addDays(date, dir*7);
  return addDays(date, dir);
}

/* ===== 未完成 / 已完成 ===== */
function renderList(kind){
  if(!CUR){ renderGate(); return; }
  const all = items();
  const list = kind==='missed'
    ? all.filter(i=>i.status==='missed')
    : all.filter(i=>i.status==='done').sort((a,b)=> (b.doneAt||'').localeCompare(a.doneAt||''));

  $('#app').innerHTML = `
    <div class="top">
      <button class="ghost" id="back">返回</button>
      <h1>${kind==='missed'?'未完成':'已完成'}</h1>
      <span style="width:64px"></span>
    </div>
    ${list.length ? list.map(i=>renderItem(i, true)).join('')
      : `<div class="empty">${kind==='missed'?'没有欠账':'还什么都没完成'}</div>`}
    <div class="foot">${kind==='missed'?'点「补上」就算完成，它会进已完成':'长按可以再走一遍完成动画'}</div>
  `;
  $('#back').onclick = renderHome;
  bindGestures();
}

/* ===== 日历 ===== */
function renderCalendar(st){
  if(!CUR){ renderGate(); return; }
  const today = new Date();
  const base = st.base ? new Date(st.base.getFullYear(), st.base.getMonth(), 1)
                       : new Date(today.getFullYear(), today.getMonth(), 1);
  const sel = st.sel || null;

  const first = new Date(base.getFullYear(), base.getMonth(), 1);
  const startIdx = (first.getDay()+6)%7;           // 周一开头
  const daysIn = new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();
  const all = items();

  const has = (d)=>{
    const dk = ymd(d);
    return {
      y: all.some(i=>i.level==='year' && i.key===yKey(d)),
      m: all.some(i=>i.level==='month' && i.key===ymKey(d)),
      w: all.some(i=>i.level==='week' && i.key===isoWeekKey(d)),
      dd: all.some(i=>i.level==='day' && i.key===dk)
    };
  };

  let cells = '';
  for(let i=0;i<startIdx;i++) cells += `<div class="cell blank"></div>`;
  for(let d=1; d<=daysIn; d++){
    const dt = new Date(base.getFullYear(), base.getMonth(), d);
    const h = has(dt);
    const isToday = ymd(dt)===ymd(today);
    const isSel = sel && ymd(dt)===sel;
    const dots = [h.y?'y':'',h.m?'m':'',h.w?'w':'',h.dd?'d':''].filter(Boolean)
      .map(c=>`<span class="dot ${c}"></span>`).join('');
    cells += `<div class="cell ${isToday?'today':''} ${isSel?'sel':''}" data-day="${ymd(dt)}">
      <span>${d}</span><div class="dots">${dots}</div>
    </div>`;
  }

  let detail = '';
  if(sel){
    const d = new Date(sel+'T00:00:00');
    const yItems  = all.filter(i=>i.level==='year'  && i.key===yKey(d));
    const mItems  = all.filter(i=>i.level==='month' && i.key===ymKey(d));
    const wItems  = all.filter(i=>i.level==='week'  && i.key===isoWeekKey(d));
    const dItems  = all.filter(i=>i.level==='day'   && i.key===sel);
    const sec = (title, arr)=>`
      <div class="kicker">${title}</div>
      ${arr.length ? arr.map(i=>renderItem(i)).join('') : `<div class="empty" style="padding:8px 0">空</div>`}
      <div class="divider"></div>`;
    detail = `
      <div class="daytitle">${cnDate(sel)} 周${WEEK_CN[(d.getDay()+6)%7]}</div>
      ${sec('年 度 目 标', yItems)}
      ${sec('月 度 目 标', mItems)}
      ${sec('本 周 目 标', wItems)}
      ${sec('本 日 任 务', dItems)}
      <div style="height:4px"></div>`;
  }

  $('#app').innerHTML = `
    <div class="top">
      <button class="ghost" id="back">返回</button>
      <h1>日历</h1>
      <span style="width:64px"></span>
    </div>
    <div class="card">
      <div class="calhead">
        <button class="ghost" id="pm">‹</button>
        <div class="m">${base.getFullYear()} 年 ${base.getMonth()+1} 月</div>
        <button class="ghost" id="nm">›</button>
      </div>
      <div class="grid">
        ${WEEK_CN.map(w=>`<div class="wd">${w}</div>`).join('')}
        ${cells}
      </div>
    </div>
    ${detail}
  `;
  $('#back').onclick = renderHome;
  $('#pm').onclick = ()=> renderCalendar({base:new Date(base.getFullYear(), base.getMonth()-1, 1), sel});
  $('#nm').onclick = ()=> renderCalendar({base:new Date(base.getFullYear(), base.getMonth()+1, 1), sel});
  document.querySelectorAll('[data-day]').forEach(c=>{
    c.onclick = ()=> renderCalendar({base, sel:c.dataset.day});
  });
  bindGestures();
}

/* ===== 手势：长按蓄力 ===== */
const PRESS_MS = 850;
function bindGestures(){
  document.querySelectorAll('.item[data-id]').forEach(el=>{
    if(el.dataset.bound) return;
    el.dataset.bound = '1';

    const fill = el.querySelector('.fill');
    let raf = null, t0 = 0, startX = 0, startY = 0, moved = false, canceled = false;

    const reset = ()=>{
      if(raf) cancelAnimationFrame(raf), raf = null;
      el.classList.remove('pressing');
      if(fill) fill.style.width = '0%';
    };
    const step = ()=>{
      const p = Math.min(1, (performance.now()-t0)/PRESS_MS);
      if(fill) fill.style.width = (p*100).toFixed(1)+'%';
      if(p >= 1){ reset(); finish(el.dataset.id, el); return; }
      raf = requestAnimationFrame(step);
    };

    el.addEventListener('pointerdown', ev=>{
      if(ev.target.closest('button')) return;   // 点按钮不算
      if(ev.button !== undefined && ev.button !== 0) return;
      moved = false; canceled = false;
      startX = ev.clientX; startY = ev.clientY;
      el.classList.add('pressing');
      if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
      t0 = performance.now();
      raf = requestAnimationFrame(step);
    });
    el.addEventListener('pointermove', ev=>{
      if(!raf) return;
      if(Math.abs(ev.clientX-startX) > 12 || Math.abs(ev.clientY-startY) > 12){
        moved = true; reset();
      }
    });
    ['pointerup','pointercancel','pointerleave'].forEach(t=>{
      el.addEventListener(t, ()=>{ if(raf) reset(); });
    });
    el.addEventListener('contextmenu', e=> e.preventDefault());
  });

  document.querySelectorAll('[data-done]').forEach(b=>{
    b.onclick = ()=> finish(b.dataset.done);
  });
  document.querySelectorAll('[data-miss]').forEach(b=>{
    b.onclick = ()=> setStatus(b.dataset.miss, 'missed');
  });
  document.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.del;
      const it = items().find(x=>x.id===id);
      if(!it) return;
      if(!confirm('删掉「'+it.title+'」？删了就没有了')) return;
      book().items = items().filter(x=>x.id!==id);
      save(); rerender();
    };
  });
}

function finish(id, el){
  const it = items().find(x=>x.id===id);
  if(!it) return;
  const mark = ()=>{
    it.status = 'done';
    it.doneAt = new Date().toISOString();
    save();
    rerender();
    toast('完成');
  };
  if(el && el.parentElement){
    el.classList.add('out');
    setTimeout(mark, 220);
  } else mark();
}
function setStatus(id, st){
  const it = items().find(x=>x.id===id);
  if(!it) return;
  it.status = st;
  if(st==='done') it.doneAt = new Date().toISOString();
  save(); rerender();
  toast(st==='missed' ? '记到未完成' : '完成');
}

/* 按当前视图重画（保留浏览中的周期） */
let lastLevel = {level:null, date:null};
function rerender(){
  switch(VIEW.name){
    case 'level':   renderLevel(lastLevel.level, lastLevel.date); break;
    case 'cal':     renderCalendar({}); break;
    case 'missed':  renderList('missed'); break;
    case 'done':    renderList('done'); break;
    default:        renderHome();
  }
}

/* 包一层，记住层级页的日期 */
const _renderLevel = renderLevel;
renderLevel = function(level, date){ lastLevel = {level, date}; VIEW = {name:'level'}; _renderLevel(level, date); };
const _renderCal = renderCalendar;
renderCalendar = function(st){ VIEW = {name:'cal'}; _renderCal(st); };
const _renderList = renderList;
renderList = function(kind){ VIEW = {name:kind}; _renderList(kind); };

/* ===== 启动 ===== */
(function boot(){
  applyTheme();
  if(DB.last){ CUR = DB.last; applyTheme(); renderHome(); }
  else renderGate();

  // 手机从后台切回来，跨天了要重算
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible' && VIEW.name==='home') renderHome();
  });
})();
</script>
